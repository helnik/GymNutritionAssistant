name: Deploy GymNutritionAssistant to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gym-nutrition-assistant-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify no workbook is tracked
        shell: bash
        run: |
          if git ls-files | grep -Ei '\.(xlsx?|xlsm|xlsb|csv)$'; then
            echo "::error::Tracked data files must be removed before publishing."
            exit 1
          fi
      - name: Install dependencies
        run: npm ci
      - name: Test calculations
        run: npm test
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build site
        run: npm run build
      - name: Upload only built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy this repository's Pages site
        id: deployment
        uses: actions/deploy-pages@v4
